name: Compilar APK Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Generar PressPlanningScanner.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK instalable
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar archivo final
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PressPlanningScanner.apk
          sha256sum PressPlanningScanner.apk > PressPlanningScanner.apk.sha256

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: PressPlanningScanner-APK
          path: |
            PressPlanningScanner.apk
            PressPlanningScanner.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
